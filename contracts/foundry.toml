[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
# Application contracts live in ./src; upstream (T-REX) is vendored read-only under ../vendor.
libs = ["lib", "../vendor"]
# Matches the Solidity pragma of T-REX v4.1.3 and ONCHAINID 2.2.1 (both `pragma solidity 0.8.17;`).
solc_version = "0.8.17"
# solc 0.8.17 defaults to london; pinned explicitly so the compiler and the local EVM agree.
evm_version = "london"
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 500
depth = 100
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
